[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "legal-prompt-optimization-repro"
version = "0.1.0"
description = "Frozen Phi response, full-reasoning judge, and joint GEPA optimization"
requires-python = ">=3.11,<3.12"

[project.scripts]
legal-prompts = "legal_prompt_optimization.cli:main"

[tool.setuptools.packages.find]
include = ["legal_prompt_optimization*"]

[tool.setuptools.package-data]
legal_prompt_optimization = ["runtime/sitecustomize.py"]
