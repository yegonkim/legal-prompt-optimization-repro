name: CPU tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install '.[data]'
      - run: python -m unittest discover -s tests/pipeline -v
      - run: PYTHONPATH=.:tests python -m unittest discover -s tests -v
      - run: python scripts/check_public_tree.py
      - run: python -m legal_prompt_optimization.pipeline.suite --dry-run
